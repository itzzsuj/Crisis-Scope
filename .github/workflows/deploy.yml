name: Deploy React App to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ec2-user
        run: |
          echo "$PRIVATE_KEY" > deploy_key.pem
          chmod 400 deploy_key.pem
          scp -i deploy_key.pem -r build/* ${USER}@${HOST}:/usr/share/nginx/html/
          ssh -i deploy_key.pem ${USER}@${HOST} "sudo systemctl restart nginx"

